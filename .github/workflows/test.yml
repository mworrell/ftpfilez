# This workflow checks the tests and dialyzer.

name: Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linux:
    name: Test on OTP ${{ matrix.otp_version }}
    runs-on: ${{ matrix.os }}

    # This library intentionally uses OTP's FTP client, deprecated in OTP 29.
    # Keep other deprecation, undefined-function, and type checks enabled.
    env:
      FTPFILEZ_ALLOW_DEPRECATED_FTP: "1"

    strategy:
      matrix:
        otp_version: [27,28,29]
        os: [ubuntu-latest]

    container:
      image: erlang:${{ matrix.otp_version }}

    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: make
      - name: Test
        run: make test
      - name: XRef
        run: make xref
      - name: Dialyzer
        run: make dialyzer
